apiVersion: kubelift.io/v1alpha1
kind: Cluster

metadata:
  name: production

spec:
  kubernetes:
    # 必须填写完整版本号，不能使用 latest 或 v1.28 这样的模糊版本。
    version: v1.28.15

  controlPlane:
    # 当前 Master0 在集群节点间通信使用的 IPv4 地址。
    advertiseAddress: 10.0.0.10
    # 如果以后需要添加 Master，必须在首次创建集群前配置稳定入口。
    # endpoint: 10.0.0.100:6443

  network:
    podCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/12

  offline:
    # 离线包必须使用绝对路径。
    bundle: /opt/kubelift/kubernetes-v1.28.15-linux-amd64.tar.zst

  registry:
    enabled: true
    port: 5000
    mirror:
      # 可选的 Docker Hub 镜像代理。启用后会生成 containerd hosts.toml。
      enabled: false
      # endpoint: https://docker.m.daocloud.io
    # 可按镜像仓库分别配置代理，例如 ghcr.io。配置后会为每个仓库生成独立的 hosts.toml。
    # mirrors:
    #   docker.io: https://docker.m.daocloud.io
    #   ghcr.io: https://ghcr.example.com

  ssh:
    user: root
    port: 22
    # 这里只填写私钥路径，不要把私钥内容写进配置文件。
    privateKey: /root/.ssh/id_ed25519
